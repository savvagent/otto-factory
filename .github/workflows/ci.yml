name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same PR should cancel the run already in flight rather than queue
# behind it — nobody wants CI results for a commit they've already superseded. Pushes to
# master must NOT cancel each other: every push to master shares one group (github.ref is
# refs/heads/master for all of them), and under the release-gated deploy below a cancelled
# push is no longer self-healing the way it was when every push deployed -- if the push that
# merges release-please's release PR is cancelled after the tag/Release already exist but
# before `deploy` runs, no later push re-triggers it (release_created only flips true once,
# on the commit that actually created the release). See docs/specs/2026-09-10-semver-release-design.md.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the jobs below that name their own broader `permissions:` block
# (release-please) get more. Nothing else in this workflow writes to the repo or needs to.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Mirrors the hand-run gate exactly: fmt --check, clippy -D warnings, then
  # cargo test. All three ran by hand against the same checkout, so they stay
  # one job rather than three — a fmt failure should still let clippy and
  # test report their own results in the same log.
  rust:
    runs-on: ubuntu-latest
    services:
      # Same image, user, db name and port-mapping rationale as compose.yaml:
      # `cargo test` runs `#[sqlx::test]` against a real Postgres, no mocks.
      # The service account is a superuser, matching local `podman compose`,
      # which is what lets 0007_rls.sql's `CREATE ROLE of_app` succeed and
      # exercise the explicit `SET LOCAL ROLE` guard the isolation tests pin.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: otto_factory
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U factory -d otto_factory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@localhost:15433/otto_factory
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Pre-create df_app and of_app roles
        # 0007_rls.sql is frozen (migrations are forward-only) and always
        # checks for a role literally named df_app; 0018_rename_tenant_role.sql
        # renames it to of_app. Both checks are check-then-create/rename,
        # idempotent across sequential migration runs but not atomic, and
        # `#[sqlx::test]` migrates one throwaway database per test, many in
        # parallel, against this one cluster-scoped pair of roles. Pre-creating
        # only df_app (as before the rename existed) would still race: the
        # first parallel database to finish migrating renames df_app away, so
        # every other in-flight database's still-running 0007 finds it newly
        # absent and races the others on re-creating it. Pre-creating BOTH
        # roles before any test starts means every database's 0007 finds
        # df_app present (skip-create, no race) and every database's 0018
        # finds of_app already present (skip-rename, grant-only, no race) --
        # the rename branch in 0018 only ever fires for real on an actual
        # deployment migrating forward, never under this workaround.
        run: |
          psql "$DATABASE_URL" \
            -c "CREATE ROLE df_app NOLOGIN;" \
            -c "CREATE ROLE of_app NOLOGIN;"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Mirrors web/README's three commands: check (svelte-check + tsc over
  # worker/), lint (prettier --check), test (vitest). No build here — the
  # build step has no gate of its own beyond these three, and of-server's own
  # startup requires `web/` to be built first, not CI.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm test

  # Proves the deploy artifact actually builds. cargo test above can stay
  # green while the container fails if the host has OpenSSL headers the image
  # build stage lacks, so this job closes that gap by proving Dockerfile
  # itself builds.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for image-relevant changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'web/**'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' || steps.filter.outputs.image == 'true'

      - name: Build image
        if: github.event_name == 'push' || steps.filter.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Enforces Conventional Commits on PR titles, which become the master commit on squash-merge --
  # release-please's version-bump computation reads a commit's type (feat/fix/...), so a title
  # release-please can't parse is silently excluded from the changelog and the version bump. See
  # docs/specs/2026-09-10-semver-release-design.md §2 and CLAUDE.md's "Releases & versioning".
  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            of-core
            of-auth
            of-mcp
            of-billing
            of-trackers
            of-web
            of-server
            web
            docs
            ci
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$

  # Computes the next SemVer version and CHANGELOG.md entry from Conventional Commits history
  # since the last release, and maintains a single "chore: release X.Y.Z" PR carrying that bump.
  # On an ordinary push this just updates that PR (release_created stays false). When the PR
  # itself is merged, release-please recognizes its own commit, cuts the git tag + GitHub
  # Release, and release_created becomes true -- the signal `deploy` below gates on. See
  # docs/specs/2026-09-10-semver-release-design.md §1.
  release-please:
    runs-on: ubuntu-latest
    needs: [rust, web, docker-build]
    if: github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Automates docs/deploy/fly.md's manual `fly deploy -a otto-factory-mcp`: only a push that
  # release-please just turned into a real release (tag + GitHub Release cut) deploys --
  # deploying on every push to master is what release-please's version gate replaces. flyctl
  # builds remotely on Fly's own builder (--remote-only), the same path a human runs by hand --
  # this job doesn't reuse docker-build's image (that job never pushes anywhere; see its own
  # design spec) so the image is built twice, which is an accepted tradeoff for keeping this to
  # one job and one new secret.
  deploy:
    runs-on: ubuntu-latest
    needs: [release-please]
    # A deploy credential deserves its own predicate, not one inherited transitively from
    # release-please's own `if:` and `on.push.branches` -- spelled out explicitly here so an
    # edit to either of those (e.g. adding workflow_dispatch, or another push branch) can't
    # silently re-arm this job.
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -a otto-factory-mcp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
