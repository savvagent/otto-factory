name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch/PR should cancel the run already in
# flight rather than queue behind it — nobody wants CI results for a commit
# they've already superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Mirrors the hand-run gate exactly: fmt --check, clippy -D warnings, then
  # cargo test. All three ran by hand against the same checkout, so they stay
  # one job rather than three — a fmt failure should still let clippy and
  # test report their own results in the same log.
  rust:
    runs-on: ubuntu-latest
    services:
      # Same image, user, db name and port-mapping rationale as compose.yaml:
      # `cargo test` runs `#[sqlx::test]` against a real Postgres, no mocks.
      # The service account is a superuser, matching local `podman compose`,
      # which is what lets 0007_rls.sql's `CREATE ROLE of_app` succeed and
      # exercise the explicit `SET LOCAL ROLE` guard the isolation tests pin.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: otto_factory
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U factory -d otto_factory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@localhost:15433/otto_factory
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Pre-create df_app and of_app roles
        # 0007_rls.sql is frozen (migrations are forward-only) and always
        # checks for a role literally named df_app; 0018_rename_tenant_role.sql
        # renames it to of_app. Both checks are check-then-create/rename,
        # idempotent across sequential migration runs but not atomic, and
        # `#[sqlx::test]` migrates one throwaway database per test, many in
        # parallel, against this one cluster-scoped pair of roles. Pre-creating
        # only df_app (as before the rename existed) would still race: the
        # first parallel database to finish migrating renames df_app away, so
        # every other in-flight database's still-running 0007 finds it newly
        # absent and races the others on re-creating it. Pre-creating BOTH
        # roles before any test starts means every database's 0007 finds
        # df_app present (skip-create, no race) and every database's 0018
        # finds of_app already present (skip-rename, grant-only, no race) --
        # the rename branch in 0018 only ever fires for real on an actual
        # deployment migrating forward, never under this workaround.
        run: |
          psql "$DATABASE_URL" \
            -c "CREATE ROLE df_app NOLOGIN;" \
            -c "CREATE ROLE of_app NOLOGIN;"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Mirrors web/README's three commands: check (svelte-check + tsc over
  # worker/), lint (prettier --check), test (vitest). No build here — the
  # build step has no gate of its own beyond these three, and of-server's own
  # startup requires `web/` to be built first, not CI.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm test

  # Proves the deploy artifact actually builds. cargo test above can stay
  # green while the container fails if the host has OpenSSL headers the image
  # build stage lacks, so this job closes that gap by proving Dockerfile
  # itself builds.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for image-relevant changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'web/**'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' || steps.filter.outputs.image == 'true'

      - name: Build image
        if: github.event_name == 'push' || steps.filter.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
