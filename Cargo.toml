[workspace]
resolver = "2"
members = [
  "crates/of-core",
  "crates/of-auth",
  "crates/of-mcp",
  "crates/of-billing",
  "crates/of-trackers",
  "crates/of-web",
  "crates/of-server",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
of-core = { path = "crates/of-core" }
of-auth = { path = "crates/of-auth" }
of-mcp = { path = "crates/of-mcp" }
of-billing = { path = "crates/of-billing" }
of-trackers = { path = "crates/of-trackers" }
of-web = { path = "crates/of-web" }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
http = "1"
rmcp = { version = "=2.0.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
futures = "0.3"
regex = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
aes-gcm = "0.10"
argon2 = "0.5"
# `otpauth` adds issuer/account_name and get_url() for the provisioning URI
# an authenticator app scans; `gen_secret` gives Secret::generate_secret().
totp-rs = { version = "5", default-features = false, features = ["gen_secret", "otpauth"] }
jsonwebtoken = "9"
# Loads .env for local runs. Never overrides a variable already set, so a
# deployment's real environment always wins over a file that got shipped.
dotenvy = "0.15"

[profile.release]
lto = "thin"
strip = true
