[package]
name = "of-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A library as well as a binary, so the router assembly is reachable from an
# integration test. A `main.rs` that can only be exercised by starting a process
# is a `main.rs` whose route collisions are found by a deployment.
[lib]
name = "of_server"
path = "src/lib.rs"

[[bin]]
name = "of-server"
path = "src/main.rs"

[dependencies]
of-core.workspace = true
of-auth.workspace = true
of-mcp.workspace = true
of-billing.workspace = true
of-trackers.workspace = true
of-web.workspace = true
sqlx.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
http.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
dotenvy.workspace = true

[dev-dependencies]
of-core.workspace = true
of-auth.workspace = true
