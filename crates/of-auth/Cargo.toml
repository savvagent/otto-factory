[package]
name = "of-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
of-core.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum.workspace = true
http.workspace = true
async-trait.workspace = true
reqwest.workspace = true
url.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
totp-rs.workspace = true
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation", "resident-key-support", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"

[dev-dependencies]
# Integration tests link of-auth as an external crate, so anything they use
# directly must be declared here even when it is already a normal dependency.
tokio = { workspace = true, features = ["full"] }
of-core.workspace = true
sqlx.workspace = true
totp-rs.workspace = true
sha2.workspace = true
base64.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
webauthn-authenticator-rs = { version = "0.5.4", default-features = false, features = ["softtoken"] }
webauthn-rs-proto = "0.5.5"
