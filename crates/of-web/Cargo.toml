[package]
name = "of-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
of-core.workspace = true
of-auth.workspace = true
of-billing.workspace = true
of-trackers.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum.workspace = true
http.workspace = true
tower-http.workspace = true
url.workspace = true
async-trait.workspace = true
tokio.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Integration tests link of-web as an external crate, so anything they name
# directly has to be declared here too.
tokio = { workspace = true, features = ["full"] }
of-core.workspace = true
of-auth.workspace = true
of-billing.workspace = true
sqlx.workspace = true
http.workspace = true
axum.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
totp-rs.workspace = true
# `ServiceExt::oneshot`, for driving the assembled router without binding a port.
tower = { workspace = true, features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "resident-key-support", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
