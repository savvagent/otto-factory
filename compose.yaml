# Local Postgres for development and `#[sqlx::test]` integration tests.
# Host port 15433 is deliberately non-standard so it cannot clash with a system
# Postgres or with dark-agent's manager-queue container (which uses 15432).
services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: otto_factory
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d otto_factory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - factory-pg:/var/lib/postgresql/data

volumes:
  factory-pg:
